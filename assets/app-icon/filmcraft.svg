<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TSMovie app icon: original work for Solusi Daya Indonesia (Tech Services SDI). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7de1"/>
      <stop offset="1" stop-color="#0b3f91"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <path d="M0 112a112 112 0 0 1 112-112h288a112 112 0 0 1 112 112v58C380 214 132 214 0 170z" fill="url(#gloss)"/>
  <!-- clapper arm, tilted open -->
  <g transform="rotate(-14 96 150)">
    <rect x="96" y="104" width="320" height="56" rx="10" fill="#f4f6fa"/>
    <path d="M128 104h44l-36 56h-44zM212 104h44l-36 56h-44zM296 104h44l-36 56h-44zM380 104h36v6l-32 50h-44z" fill="#1b1f26"/>
  </g>
  <!-- board body -->
  <rect x="96" y="176" width="320" height="204" rx="18" fill="url(#board)"/>
  <rect x="96" y="176" width="320" height="44" rx="18" fill="#f4f6fa"/>
  <rect x="96" y="200" width="320" height="20" fill="#f4f6fa"/>
  <path d="M128 176h44l-28 44h-44zM212 176h44l-28 44h-44zM296 176h44l-28 44h-44zM380 176h36v8l-23 36h-44z" fill="#1b1f26"/>
  <!-- play button -->
  <circle cx="256" cy="300" r="58" fill="url(#play)"/>
  <path d="M238 268v64l52-32z" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="256" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-style="italic" font-size="78" fill="#ffffff" letter-spacing="1">TSMOVIE</text>
</svg>
